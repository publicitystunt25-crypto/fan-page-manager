name: Keep the bot awake

# Render's free plan puts the bot to sleep after ~15 minutes without a request, which stops posting and analytics.
# A request every 10 minutes keeps it up.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 60 -o /dev/null -w "%{http_code}\n" https://fan-page-manager.onrender.com/pages || true
