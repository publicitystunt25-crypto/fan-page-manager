name: Keep the bot awake

# Render's free plan puts the bot to sleep after ~15 minutes without a request, which stops posting.
# The auto feed starts at :07, renders for ~5 minutes and the bot then posts for up to ~27 minutes, so the bot is pinged
# every 8 minutes from :05 to :45 each hour and left alone for the rest.
# Started on time by cron-job.org (GitHub's own schedule runs late), or by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 60 -o /dev/null -w "%{http_code}\n" https://fan-page-manager.onrender.com/pages || true
