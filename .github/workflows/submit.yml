name: Render submitted clips

# Renders every clip submitted through the bot's /submit page (submissions/<id>.json in the bucket) that has no manifest
# yet, then queues it for the bot. Started on a short timer by cron-job.org (GitHub's own schedule runs late) or by hand.
on:
  push:
    paths:
      - "submit_trigger.txt"   # pushing this file starts a run without any token
  workflow_dispatch:

# the same group as the auto feed: both add entries to auto/queue.json, so they must not run at the same time
concurrency:
  group: queue-writers
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-render.txt

      - name: Install
        run: pip install -r requirements-render.txt

      - name: Render and queue
        run: python submit_worker.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RENDER_WORKERS: "3"
